<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traffix — Smarter Routes</title>
<style>
:root{--ink:#14213d;--muted:#71809c;--pink:#f43f68;--pink2:#ff6582;--blue:#4385f5;--purple:#7252f5;--green:#24b875;--orange:#ffad35;--line:#e8edf5;--bg:#f5f7fc;--card:#fff;--shadow:0 12px 35px #273d6510}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
#welcome{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 10% 10%,#ffe2e8 0,transparent 32%),radial-gradient(circle at 90% 85%,#d9f8ed 0,transparent 30%),linear-gradient(135deg,#f8f4ff,#f7fbff)}
.welcome-card{width:min(480px,100%);background:#ffffffde;border:1px solid #fff;border-radius:30px;padding:42px;box-shadow:0 24px 70px #2a3c6518;text-align:center}.logo{display:flex;align-items:center;gap:12px;font-size:36px;font-weight:850;letter-spacing:-1.7px;justify-content:center}.logo b{color:var(--pink)}.traffic-light{width:34px;height:56px;border-radius:13px;background:#18233c;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:5px;box-shadow:inset 0 0 0 1px #ffffff22}.traffic-light i{width:13px;height:13px;border-radius:50%;display:block;background:#f43f68}.traffic-light i:nth-child(2){background:#ffbd3e}.traffic-light i:nth-child(3){background:#2fc47c}.welcome-art{height:165px;margin:30px -12px 24px;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#fbe8f0,#d9efff);position:relative}.sun{position:absolute;right:48px;top:22px;width:46px;height:46px;background:#ffd36b;border-radius:50%}.skyline{position:absolute;bottom:60px;left:0;right:0;height:70px;display:flex;align-items:end;justify-content:center;gap:7px}.skyline span{width:22px;background:#87b6e9;border-radius:5px 5px 0 0;opacity:.8}.skyline span:nth-child(2n){background:#a7a4e9}.road{position:absolute;bottom:-10px;left:-5%;width:110%;height:80px;background:#4c648b;clip-path:polygon(30% 0,70% 0,100% 100%,0 100%)}.road:after{content:"";position:absolute;top:0;left:50%;height:100%;border-left:4px dashed #fff9}.car{position:absolute;bottom:15px;left:47%;width:45px;height:25px;border-radius:10px 10px 6px 6px;background:#f43f68;border:3px solid #fff;box-shadow:0 7px 12px #20375b33}.welcome-card h1{font-size:26px;margin:0 0 8px}.welcome-card p{color:var(--muted);margin:0 0 25px}.name-input{width:100%;padding:15px 16px;border:1px solid #dfe6f1;border-radius:14px;outline:none;background:#fff;margin-bottom:12px}.name-input:focus{border-color:var(--pink);box-shadow:0 0 0 3px #f43f6818}.primary{background:linear-gradient(100deg,var(--pink),#ff4b7b);color:white;border-radius:14px;padding:14px 20px;font-weight:750;box-shadow:0 8px 18px #f43f682a}.welcome-card .primary{width:100%}.tiny{font-size:12px;color:#97a1b5;margin-top:16px}
#app{min-height:100vh;display:grid;grid-template-columns:220px minmax(420px,1fr) 285px;gap:18px;padding:18px;max-width:1700px;margin:auto}.sidebar,.rightbar,.panel{background:var(--card);border:1px solid #edf0f6;border-radius:22px;box-shadow:var(--shadow)}.sidebar{padding:22px 14px;display:flex;flex-direction:column;min-height:calc(100vh - 36px);position:sticky;top:18px;height:calc(100vh - 36px)}.sidebar .logo{font-size:25px;justify-content:flex-start;padding:0 10px 28px;letter-spacing:-1px}.sidebar .traffic-light{width:24px;height:39px;border-radius:9px;padding:4px}.sidebar .traffic-light i{width:8px;height:8px}.nav{display:grid;gap:7px}.nav button{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:12px;background:transparent;color:#53627f;text-align:left;font-weight:650}.nav button:hover{background:#f7f8fc}.nav button.active{background:#fff0f4;color:var(--pink)}.nav .ico{font-size:19px;width:22px;text-align:center}.sidebar-bottom{margin-top:auto;padding:14px 12px;color:var(--muted);font-size:12px}.sidebar-bottom strong{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}
main{min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 5px 18px}.greeting small{color:var(--muted);font-size:13px}.greeting h1{font-size:25px;margin:3px 0 0;letter-spacing:-.8px}.greeting h1 span{color:var(--pink)}.top-actions{display:flex;gap:9px}.round-btn{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:#fff;color:#50617f;font-size:18px}.searchbar{display:flex;gap:10px;background:#fff;padding:8px;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px}.searchbar input{border:0;outline:0;flex:1;min-width:0;padding:8px 12px}.searchbar button{border-radius:11px;padding:11px 20px;background:var(--pink);color:white;font-weight:700}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.quick{padding:16px 10px;background:white;border:1px solid var(--line);border-radius:17px;text-align:center;box-shadow:var(--shadow);color:var(--ink);font-weight:700}.quick .qicon{width:52px;height:52px;margin:0 auto 10px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:24px}.quick:nth-child(1) .qicon{background:linear-gradient(140deg,#ff6382,#ed3564)}.quick:nth-child(2) .qicon{background:linear-gradient(140deg,#5d9dff,#3875ee)}.quick:nth-child(3) .qicon{background:linear-gradient(140deg,#ffc14c,#ff9828)}.quick:nth-child(4) .qicon{background:linear-gradient(140deg,#4dcc88,#20a968)}.quick small{display:block;color:var(--muted);font-weight:500;margin-top:4px;font-size:11px}
.content-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(220px,.85fr);gap:14px}.panel{padding:18px;margin-bottom:14px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.panel-head h2{font-size:16px;margin:0}.text-btn{background:transparent;color:#3478ef;font-size:12px;font-weight:750}.map{height:255px;border-radius:15px;overflow:hidden;position:relative;background-color:#e6f3ed;background-image:linear-gradient(28deg,transparent 45%,#fff 46%,#fff 49%,#f8d1a7 50%,#fff 51%,#fff 54%,transparent 55%),linear-gradient(115deg,transparent 35%,#fff 36%,#fff 39%,#d4e3bc 40%,#fff 41%,#fff 44%,transparent 45%),linear-gradient(165deg,transparent 30%,#fff 31%,#fff 34%,#f8d1a7 35%,#fff 36%,#fff 39%,transparent 40%),repeating-linear-gradient(90deg,#d7e8dd 0 22px,#eaf4eb 22px 45px)}.map:before,.map:after{content:"";position:absolute;width:130%;height:7px;background:#f5c45d;border:2px solid white;left:-10%;top:48%;transform:rotate(-25deg);box-shadow:0 0 0 1px #e5a34b}.map:after{transform:rotate(33deg);top:56%;background:#ed6070;box-shadow:0 0 0 1px #fff}.map-label{position:absolute;background:#fff;padding:7px 10px;border-radius:9px;font-size:11px;font-weight:700;box-shadow:0 4px 12px #23364b20;z-index:2}.map-label.one{left:13px;top:12px}.map-label.two{right:14px;top:72px}.pin{position:absolute;z-index:3;width:30px;height:30px;border:4px solid #fff;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);box-shadow:0 3px 9px #1e335533}.pin.red{background:#f43f68;left:25%;top:65%}.pin.green{background:#27b879;left:70%;top:28%}.pin.blue{background:#3f85f5;left:51%;top:45%;width:22px;height:22px}.map-controls{position:absolute;right:12px;bottom:12px;display:grid;gap:6px;z-index:4}.map-controls button{background:#fff;border-radius:9px;width:34px;height:34px;box-shadow:0 3px 10px #20344c18;font-size:18px}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.route-card{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px}.route-card.featured{border-color:#ff8aa2;background:linear-gradient(130deg,#fff,#fff7f9)}.route-top{display:flex;justify-content:space-between;align-items:center}.route-top strong{font-size:22px}.tag{font-size:10px;padding:5px 8px;border-radius:20px;background:#e0f8ea;color:#16985b;font-weight:800}.route-card p{margin:7px 0;color:var(--muted);font-size:12px}.route-bottom{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#209a62}.small-primary{padding:8px 14px;background:var(--pink);color:white;border-radius:10px;font-size:11px;font-weight:750}.feature-banner{padding:18px;border-radius:17px;background:linear-gradient(120deg,#6c50f5,#a38bff);color:white;position:relative;overflow:hidden;min-height:120px}.feature-banner h3{margin:0 0 7px;font-size:18px}.feature-banner p{font-size:12px;opacity:.9;max-width:180px;margin:0}.feature-banner .emoji{position:absolute;right:10px;bottom:8px;font-size:52px}.traffic-row,.alert-row,.saved-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #edf0f6}.traffic-row:last-child,.alert-row:last-child,.saved-row:last-child{border-bottom:0}.status-icon{width:37px;height:37px;border-radius:12px;display:grid;place-items:center;color:white;font-size:18px;flex-shrink:0}.status-icon.red{background:#f64b6f}.status-icon.orange{background:#ffad35}.status-icon.green{background:#27b879}.status-icon.blue{background:#4385f5}.row-copy{min-width:0;flex:1}.row-copy strong{display:block;font-size:12px}.row-copy small{display:block;font-size:11px;color:var(--muted);margin-top:4px}.chev{color:#93a0b7;font-size:21px}.rightbar{padding:18px;min-width:0}.profile-mini{display:flex;align-items:center;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:17px}.avatar{width:48px;height:48px;border-radius:17px;background:#ffe6ed;display:grid;place-items:center;font-size:26px}.profile-mini strong{display:block;font-size:14px}.profile-mini small{color:var(--muted);font-size:11px}.rightbar .panel{padding:0;border:0;box-shadow:none;margin-bottom:20px}.rightbar .panel-head{margin-bottom:8px}.rightbar .panel-head h2{font-size:15px}.eco{padding:16px;border-radius:17px;background:linear-gradient(135deg,#e5fbf0,#e1f5ff);margin-bottom:18px}.eco h3{color:#178c54;margin:0 0 5px;font-size:15px}.eco p{color:#4f7e6b;font-size:11px;line-height:1.5;margin:0}.eco .leaf{font-size:25px;float:right}.page-title{font-size:25px;margin:6px 0 5px}.page-sub{color:var(--muted);margin:0 0 20px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.stat{padding:18px;border-radius:16px;background:#fff;border:1px solid var(--line)}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:8px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}.setting-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}.setting-row:last-child{border-bottom:0}.toggle{width:42px;height:24px;border-radius:30px;background:#d7deea;padding:3px}.toggle:after{content:"";display:block;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}.toggle.on{background:var(--green)}.toggle.on:after{transform:translateX(18px)}.form-control{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:6px 0 12px;outline:0}.form-control:focus{border-color:var(--pink)}.notice{background:#fff7e7;border:1px solid #ffe4ad;border-radius:12px;padding:12px;font-size:12px;color:#9a6810;margin-top:12px}
.route-results{margin:12px 0}.route-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#fff1f4;border:1px solid #ffd4de;border-radius:15px;padding:15px;margin-bottom:12px}.route-summary strong{font-size:23px;color:#f43f68}.route-summary small{display:block;color:#71809c;margin-top:4px}.route-option{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #edf0f6}.route-option:last-child{border-bottom:0}.route-line{height:36px;width:36px;display:grid;place-items:center;border-radius:12px;font-size:19px}.route-option strong{font-size:13px}.route-option small{display:block;color:#71809c;font-size:11px;margin-top:4px;line-height:1.5}.route-time{text-align:right}.route-time b{font-size:18px;display:block}.route-time span{font-size:10px;color:#71809c}.route-disclaimer{font-size:11px;line-height:1.5;color:#9a6810;background:#fff8e9;border:1px solid #ffedc2;padding:11px;border-radius:11px;margin-top:12px}\n@media(max-width:1180px){#app{grid-template-columns:190px minmax(0,1fr);}.rightbar{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:16px}.profile-mini{display:none}.content-grid{grid-template-columns:1fr 1fr}}
@media(max-width:760px){#app{display:block;padding:10px}.sidebar{position:static;height:auto;min-height:0;margin-bottom:12px;padding:12px}.sidebar .logo{padding:0 8px 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:10px}.sidebar-bottom{display:none}.rightbar{display:block;margin-top:14px}.content-grid,.two-col{grid-template-columns:1fr}.quick-grid{grid-template-columns:repeat(2,1fr)}.topbar{padding:10px 2px 15px}.greeting h1{font-size:21px}.stats{grid-template-columns:1fr}.welcome-card{padding:28px 22px}}
</style>
</head>
<body>
<section id="welcome">
  <div class="welcome-card">
    <div class="logo"><span class="traffic-light"><i></i><i></i><i></i></span><span>Traffi<b>x</b></span></div>
    <div class="welcome-art"><div class="sun"></div><div class="skyline"><span style="height:35px"></span><span style="height:60px"></span><span style="height:44px"></span><span style="height:70px"></span><span style="height:52px"></span><span style="height:63px"></span><span style="height:38px"></span><span style="height:55px"></span></div><div class="road"></div><div class="car"></div></div>
    <h1>Let's make your journey better.</h1><p>What should we call you?</p>
    <form id="nameForm"><input id="nameInput" class="name-input" maxlength="32" placeholder="Enter your name" autocomplete="given-name" required><button class="primary" type="submit">Let's Go <span style="margin-left:10px">→</span></button></form>
    <div class="tiny">Your everyday traffic companion</div>
  </div>
</section>
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="logo"><span class="traffic-light"><i></i><i></i><i></i></span><span>Traffi<b>x</b></span></div>
    <nav class="nav" id="nav">
      <button class="active" data-page="home"><span class="ico">⌂</span>Home</button>
      <button data-page="map"><span class="ico">⌖</span>Live Map</button>
      <button data-page="routes"><span class="ico">⌁</span>Smart Routes</button>
      <button data-page="alerts"><span class="ico">♧</span>Traffic Alerts</button>
      <button data-page="saved"><span class="ico">♡</span>Saved Places</button>
      <button data-page="history"><span class="ico">◷</span>Travel History</button>
      <button data-page="settings"><span class="ico">⚙</span>Settings</button>
      <button data-page="help"><span class="ico">?</span>Help & Support</button>
    </nav>
    <div class="sidebar-bottom"><strong>Traffix commute</strong>Smarter routes. Smoother journeys.</div>
  </aside>
  <main>
    <div class="topbar"><div class="greeting"><small id="dayGreeting">YOUR DAILY TRAFFIC COMPANION</small><h1 id="hello">Good day, <span>there!</span></h1></div><div class="top-actions"><button class="round-btn" title="Notifications" onclick="showPage('alerts')">♧</button><button class="round-btn" title="Profile" onclick="showPage('profile')">☺</button></div></div>
    <div id="pageContent"></div>
  </main>
  <aside class="rightbar" id="rightbar"></aside>
</div>
<script>
const $=s=>document.querySelector(s);let userName=localStorage.getItem('traffixName')||'';let savedPlaces=JSON.parse(localStorage.getItem('traffixPlaces')||'["Home","GNITS — Shaikpet"]');let history=JSON.parse(localStorage.getItem('traffixHistory')||'[]');let currentPage='home';
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function startApp(name){userName=name.trim()||'Commuter';localStorage.setItem('traffixName',userName);$('#welcome').classList.add('hidden');$('#app').classList.remove('hidden');$('#hello').innerHTML='Good day, <span>'+escapeHTML(userName)+'!</span>';showPage('home')}
if(userName){startApp(userName)}
$('#nameForm').addEventListener('submit',e=>{e.preventDefault();startApp($('#nameInput').value)});
function showPage(page){currentPage=page;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const c=$('#pageContent');const rb=$('#rightbar');
const quick=`<div class="quick-grid"><button class="quick" onclick="showPage('map')"><div class="qicon">🚘</div>Live Traffic<small>See road conditions</small></button><button class="quick" onclick="showPage('routes')"><div class="qicon">⌁</div>Smart Routes<small>Find a faster way</small></button><button class="quick" onclick="showPage('routes')"><div class="qicon">◷</div>Travel Time<small>Plan your trip</small></button><button class="quick" onclick="showPage('alerts')"><div class="qicon">♧</div>Alerts<small>Road updates</small></button></div>`;
const map=`<div class="panel"><div class="panel-head"><h2>Live Traffic Map</h2><button class="text-btn" onclick="showPage('map')">Open full map →</button></div><div class="map"><span class="map-label one">● Live traffic</span><span class="map-label two">Heavy traffic · 15 min delay</span><i class="pin red"></i><i class="pin green"></i><i class="pin blue"></i><div class="map-controls"><button onclick="toast('Map zoomed in')">+</button><button onclick="toast('Map zoomed out')">−</button><button onclick="toast('Showing your approximate location')">◎</button></div></div><div class="legend"><span><i class="dot" style="background:#f43f68"></i>Heavy traffic</span><span><i class="dot" style="background:#ffad35"></i>Moderate</span><span><i class="dot" style="background:#27b879"></i>Clear roads</span></div></div>`;
const routes=`<div class="panel"><div class="panel-head"><h2>Suggested routes</h2><span class="tag">3 OPTIONS</span></div>${routeCard('Fastest','18 min','6.4 km','Less traffic · Save 5 min',true)}${routeCard('Balanced','22 min','7.1 km','Moderate traffic · Popular route')}${routeCard('Shortest','25 min','5.8 km','More turns · City roads')}</div>`;
const alerts=`<div class="panel"><div class="panel-head"><h2>Hyderabad traffic alerts</h2><span class="tag">DEMO UPDATES</span></div>${alertRow('🚘','red','Heavy traffic','HITEC City Road · 2.3 km','Slow moving traffic ahead')}${alertRow('⚠','orange','Road work','Madhapur Road · 1.5 km','Expect lane reduction')}${alertRow('☂','blue','Weather alert','Jubilee Hills','Light rain may affect traffic')}${alertRow('🚑','green','Emergency corridor','Banjara Hills','Priority corridor status demo')}</div>`;
const search=`<div class="panel" style="padding:12px;margin-bottom:16px"><div class="panel-head"><h2>Plan your journey</h2><span class="tag">HYDERABAD</span></div><div class="searchbar" style="flex-wrap:wrap;box-shadow:none;margin-bottom:0"><input id="origin" list="hydPlaces" placeholder="Starting point (e.g. GNITS, Shaikpet)" style="flex:1 1 200px"><input id="destination" list="hydPlaces" placeholder="Destination (e.g. HITEC City)" style="flex:1 1 200px"><button onclick="findRoute()">Find route</button><datalist id="hydPlaces"><option value="GNITS, Shaikpet"></option><option value="HITEC City"></option><option value="Madhapur"></option><option value="Gachibowli"></option><option value="Jubilee Hills"></option><option value="Banjara Hills"></option><option value="Charminar"></option><option value="Hussain Sagar"></option><option value="Secunderabad Railway Station"></option><option value="Ameerpet"></option><option value="Kukatpally"></option><option value="LB Nagar"></option><option value="Rajiv Gandhi International Airport"></option><option value="Mehdipatnam"></option><option value="Dilsukhnagar"></option></datalist></div><div style="font-size:11px;color:#71809c;margin:8px 4px 0">Route results appear here in Traffix — no redirect.</div></div>`;
if(page==='home'){c.innerHTML=search+`<div id="routeResults"></div>`+quick+`<div class="content-grid"><div>${map}${routes}</div><div><div class="feature-banner" style="margin-bottom:14px"><h3>Emergency Priority</h3><p>Helping ambulances reach people faster through smarter signal coordination.</p><span class="emoji">🚑</span></div><div class="panel"><div class="panel-head"><h2>Traffic around Hyderabad</h2><button class="text-btn" onclick="showPage('map')">View all</button></div>${trafficRow('🚘','red','HITEC City Road','Heavy · 15 min delay')}${trafficRow('🚕','orange','Madhapur Road','Moderate · 8 min delay')}${trafficRow('🚙','green','Gachibowli Road','Clear · 2 min delay')}</div></div></div>`;renderRightbar()}
else if(page==='map'){c.innerHTML=`<h1 class="page-title">Live traffic map</h1><p class="page-sub">Explore sample traffic conditions around Hyderabad.</p>`+search+`<div style="height:480px">`+map+`</div>`;renderRightbar()}
else if(page==='routes'){c.innerHTML=`<h1 class="page-title">Smart routes</h1><p class="page-sub">Compare route options before you leave.</p>`+search+`<div id="routeResults"></div><div class="stats"><div class="stat"><small>Fastest option</small><strong>18 min</strong><small>Estimated journey</small></div><div class="stat"><small>Distance</small><strong>6.4 km</strong><small>Suggested route</small></div><div class="stat"><small>Eco tip</small><strong style="color:#21a86b">−5 min</strong><small>Compared with slower route</small></div></div>`+routes+`<div class="notice">Hyderabad route times are illustrative demo estimates, not live navigation data.</div>`;renderRightbar()}
else if(page==='alerts'){c.innerHTML=`<h1 class="page-title">Hyderabad traffic alerts</h1><p class="page-sub">Sample road updates for Hyderabad locations.</p>`+alerts;renderRightbar()}
else if(page==='saved'){c.innerHTML=`<h1 class="page-title">Saved places</h1><p class="page-sub">Keep your frequent destinations close at hand.</p><div class="panel"><div class="panel-head"><h2>Your places</h2><button class="text-btn" onclick="addPlace()">+ Add place</button></div><div id="placesList">${placesMarkup()}</div></div><div class="panel"><h2>Add a place</h2><input class="form-control" id="placeInput" placeholder="e.g. Charminar, Hussain Sagar, Gachibowli"><button class="primary" onclick="addPlace()">Save place</button></div>`;renderRightbar()}
else if(page==='history'){c.innerHTML=`<h1 class="page-title">Travel history</h1><p class="page-sub">Your recent route searches on this device.</p><div class="panel"><div class="panel-head"><h2>Recent activity</h2><button class="text-btn" onclick="clearHistory()">Clear history</button></div>${history.length?history.map(h=>`<div class="traffic-row"><div class="status-icon blue">↗</div><div class="row-copy"><strong>${escapeHTML(h.to)}</strong><small>${escapeHTML(h.when)} · ${escapeHTML(h.time)}</small></div><span class="chev">›</span></div>`).join(''):'<p class="page-sub">Search routes between Hyderabad locations and your recent searches will appear here.</p>'}</div>`;renderRightbar()}
else if(page==='settings'){c.innerHTML=`<h1 class="page-title">Settings</h1><p class="page-sub">Personalize your Traffix experience.</p><div class="panel"><h2>Preferences</h2>${setting('Traffic notifications','Receive road alerts and route updates',true)}${setting('Route suggestions','Show alternate routes for journeys',true)}${setting('Eco-driving tips','Get fuel-saving travel suggestions',false)}${setting('Weather alerts','Show weather-related traffic notices',true)}</div><div class="panel"><h2>Personal details</h2><label>Your name</label><input class="form-control" id="rename" value="${escapeHTML(userName)}"><button class="primary" onclick="renameUser()">Save changes</button></div>`;renderRightbar()}
else if(page==='profile'){c.innerHTML=`<h1 class="page-title">Your profile</h1><p class="page-sub">Your personal commute space.</p><div class="panel"><div class="profile-mini"><div class="avatar">🙂</div><div><strong>${escapeHTML(userName)}</strong><small>Traffix commuter</small></div></div><label>Display name</label><input class="form-control" id="rename" value="${escapeHTML(userName)}"><button class="primary" onclick="renameUser()">Update profile</button><div class="setting-row"><span>Saved places</span><strong>${savedPlaces.length}</strong></div><div class="setting-row"><span>Recent searches</span><strong>${history.length}</strong></div></div>`;renderRightbar()}
else if(page==='help'){c.innerHTML=`<h1 class="page-title">Help & support</h1><p class="page-sub">Need a hand with your commute?</p><div class="two-col"><div class="panel"><h2>Frequently asked</h2><div class="setting-row"><span>How do route suggestions work?</span><span>＋</span></div><div class="setting-row"><span>How do I save a place?</span><span>＋</span></div><div class="setting-row"><span>Are traffic updates live?</span><span>＋</span></div><div class="notice">This prototype uses sample traffic and route information. Live services are not connected.</div></div><div class="panel"><h2>Contact the team</h2><p class="page-sub">Send a note about the app.</p><input class="form-control" id="helpSubject" placeholder="Subject"><textarea class="form-control" id="helpMessage" rows="4" placeholder="How can we help?"></textarea><button class="primary" onclick="toast('Thanks! This demo has no support server connected.')">Send message</button></div></div>`;renderRightbar()}
}
function routeCard(label,time,distance,desc,featured=false){return `<div class="route-card ${featured?'featured':''}"><div class="route-top"><div><span class="tag">${label.toUpperCase()}</span><strong style="display:block;margin-top:8px">${time}</strong></div><span style="font-size:25px;color:${featured?'#f43f68':'#7757f6'}">↗</span></div><p>${distance} · ${desc}</p><div class="route-bottom"><span>🍃 Save fuel · Lower emissions</span><button class="small-primary" onclick="startRoute('${label}','${time}')">Start</button></div></div>`}
function trafficRow(icon,color,title,desc){return `<div class="traffic-row"><div class="status-icon ${color}">${icon}</div><div class="row-copy"><strong>${title}</strong><small>${desc}</small></div><span class="chev">›</span></div>`}
function alertRow(icon,color,title,sub,desc){return `<div class="alert-row"><div class="status-icon ${color}">${icon}</div><div class="row-copy"><strong>${title}</strong><small>${sub}</small><small>${desc}</small></div><span class="chev">›</span></div>`}
function setting(title,desc,on){return `<div class="setting-row"><div><strong>${title}</strong><div style="font-size:11px;color:var(--muted);margin-top:4px">${desc}</div></div><button class="toggle ${on?'on':''}" onclick="this.classList.toggle('on')" aria-label="Toggle ${title}"></button></div>`}
function renderRightbar(){const rb=$('#rightbar');rb.innerHTML=`<div class="profile-mini"><div class="avatar">🙂</div><div><strong>${escapeHTML(userName)}</strong><small>Daily commuter</small></div><button class="text-btn" onclick="showPage('profile')">Edit</button></div><div class="panel"><div class="panel-head"><h2>Saved places</h2><button class="text-btn" onclick="showPage('saved')">View all</button></div>${savedPlaces.slice(0,3).map((p,i)=>`<div class="saved-row"><div class="status-icon ${i===0?'red':'blue'}">${i===0?'⌂':'⌖'}</div><div class="row-copy"><strong>${escapeHTML(p)}</strong><small>${i===0?'Frequent destination':'Saved location'}</small></div><span class="chev">›</span></div>`).join('')}</div><div class="eco"><span class="leaf">🍃</span><h3>Drive greener!</h3><p>Choose smoother routes to save fuel, reduce emissions and make the city cleaner.</p></div><div class="panel"><div class="panel-head"><h2>Hyderabad traffic alerts</h2><button class="text-btn" onclick="showPage('alerts')">View all</button></div>${trafficRow('🚘','red','Heavy traffic','HITEC City Road · 15 min delay')}${trafficRow('⚠','orange','Road work','Madhapur Road · Lane reduction')}${trafficRow('☂','blue','Weather alert','Light rain expected')}</div>`}
function placesMarkup(){return savedPlaces.map((p,i)=>`<div class="saved-row"><div class="status-icon ${i===0?'red':'blue'}">${i===0?'⌂':'⌖'}</div><div class="row-copy"><strong>${escapeHTML(p)}</strong><small>Saved destination</small></div><button class="text-btn" onclick="removePlace(${i})">Remove</button></div>`).join('')}
function addPlace(){const input=$('#placeInput');if(!input||!input.value.trim()){toast('Enter a place name first');return}savedPlaces.push(input.value.trim());localStorage.setItem('traffixPlaces',JSON.stringify(savedPlaces));showPage('saved');toast('Place saved')}
function removePlace(i){savedPlaces.splice(i,1);localStorage.setItem('traffixPlaces',JSON.stringify(savedPlaces));showPage('saved')}
function findRoute(){
 const from=$('#origin')?.value.trim(),to=$('#destination')?.value.trim();
 if(!from){toast('Enter your starting point');$('#origin')?.focus();return}
 if(!to){toast('Enter your destination');$('#destination')?.focus();return}
 if(from.toLowerCase()===to.toLowerCase()){toast('Starting point and destination must be different');return}
 const routes=estimateRoutes(from,to);
 history.unshift({to:from+' → '+to,when:new Date().toLocaleDateString(),time:'Traffix estimate: '+routes[0].time});
 history=history.slice(0,20);localStorage.setItem('traffixHistory',JSON.stringify(history));
 let box=document.getElementById('routeResults');
 if(!box){showPage('routes');box=document.getElementById('routeResults')}
 if(box){box.innerHTML=renderRouteResults(from,to,routes);box.scrollIntoView({behavior:'smooth',block:'nearest'})}
}
function estimateRoutes(from,to){
 const coords={
 'gnits':[17.4065,78.4147],'gnits, shaikpet':[17.4065,78.4147],
 'hitec city':[17.4435,78.3772],'madhapur':[17.4483,78.3915],
 'gachibowli':[17.4401,78.3489],'jubilee hills':[17.4310,78.4070],
 'banjara hills':[17.4126,78.4482],'charminar':[17.3616,78.4747],
 'hussain sagar':[17.4239,78.4738],'secunderabad railway station':[17.4344,78.5013],
 'ameerpet':[17.4375,78.4483],'kukatpally':[17.4849,78.4138],
 'lb nagar':[17.3457,78.5522],'rajiv gandhi international airport':[17.2403,78.4294],
 'mehdipatnam':[17.3950,78.4310],'dilsukhnagar':[17.3688,78.5247]
 };
 const norm=s=>s.toLowerCase().replace(/,\\s*hyderabad.*$/,'').trim();
 const a=coords[norm(from)],b=coords[norm(to)];
 const km=a&&b?Math.max(1.5,Math.sqrt(Math.pow((a[0]-b[0])*111,2)+Math.pow((a[1]-b[1])*101,2))*1.3):8;
 const now=new Date(),h=now.getHours(),rush=(h>=8&&h<=11)||(h>=17&&h<=20);
 const seed=[...(from+to)].reduce((n,c)=>n+c.charCodeAt(0),0);
 const base=Math.max(5,Math.round(km/25*60*(rush?1.35:1.05)+(seed%7)));
 return [
 {name:'Fastest route',km:(km*1.04).toFixed(1),mins:base,desc:'Main-road focused',color:'#27b879',icon:'↗'},
 {name:'Balanced route',km:(km*.98).toFixed(1),mins:Math.round(base*1.17),desc:'Balance of distance and traffic',color:'#4385f5',icon:'⌁'},
 {name:'Alternative route',km:(km*1.12).toFixed(1),mins:Math.round(base*1.36),desc:'Alternative roads',color:'#ffad35',icon:'⇄'}
 ].map(r=>({...r,time:r.mins+' min',arrival:new Date(now.getTime()+r.mins*60000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),traffic:rush?'Peak-hour traffic factor applied':'Typical traffic estimate'}));
}
function renderRouteResults(from,to,routes){
 return `<div class="route-results"><div class="route-summary"><div><small>YOUR JOURNEY</small><div style="font-weight:750;margin-top:5px">${escapeHTML(from)} <span style="color:#f43f68">→</span> ${escapeHTML(to)}</div><small>${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} · Hyderabad</small></div><div><strong>${routes[0].time}</strong><small>estimated · ${routes[0].km} km</small></div></div><div class="panel"><div class="panel-head"><h2>Route options</h2><span class="tag">TRAFFIX</span></div>${routes.map((r,i)=>`<div class="route-option"><div class="route-line" style="background:${r.color}18;color:${r.color}">${r.icon}</div><div><strong>${r.name}</strong><small>${r.km} km · ${r.desc}<br>${r.traffic} · Arrival around ${r.arrival}</small></div><div class="route-time"><b>${r.time}</b><span>${i===0?'FASTEST':'ESTIMATE'}</span><br><button class="small-primary" style="margin-top:7px" onclick="toast('Selected ${r.name.toLowerCase()}')">Select</button></div></div>`).join('')}<div class="route-disclaimer">These are approximate in-app prototype estimates based on location coordinates and time of day, not verified live traffic. To show genuinely live traffic and accurate ETAs inside Traffix, a routing/traffic API and API key must be connected.</div></div></div>`;
}
function startRoute(label,time){toast(label+' route selected · '+time+' (demo route)');}
function clearHistory(){history=[];localStorage.setItem('traffixHistory','[]');showPage('history')}
function renameUser(){const n=$('#rename')?.value.trim();if(!n){toast('Please enter your name');return}userName=n;localStorage.setItem('traffixName',n);$('#hello').innerHTML='Good day, <span>'+escapeHTML(n)+'!</span>';showPage(currentPage);toast('Profile updated')}
function toast(msg){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#18233c;color:#fff;padding:13px 18px;border-radius:12px;box-shadow:0 10px 30px #18233c33;z-index:99;font-size:13px;max-width:90vw';document.body.appendChild(t)}t.textContent=msg;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',2800)}
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));
</script>
</body></html>
